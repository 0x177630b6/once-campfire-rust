name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The Dockerfile's toolchain stage: Rust with the image's own libvips and ffmpeg builds.
      - name: Build toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: toolchain
          tags: campfire-toolchain
          load: true
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,scope=toolchain,mode=max

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cargo-home/registry
            target
          key: cargo-${{ hashFiles('Cargo.lock', 'bench/loadgen/Cargo.lock') }}
          restore-keys: cargo-

      # Each check runs even when an earlier one fails, so one run shows every failure. The loadgen
      # is a workspace of its own, so `--all` doesn't reach it; it builds into target/bench (as
      # bench/run does) so the cache keeps it.
      - name: Rustfmt, clippy and tests
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/src" --workdir /src \
            --env HOME=/tmp --env CARGO_HOME=/src/.cargo-home --env CARGO_TERM_COLOR=always \
            campfire-toolchain sh -uc '
              status=0
              cargo fmt --all --check || status=1
              cargo fmt --manifest-path bench/loadgen/Cargo.toml --check || status=1
              cargo clippy --locked --workspace --exclude html5ever --all-targets -- -D warnings || status=1
              cargo clippy --locked --manifest-path bench/loadgen/Cargo.toml --target-dir target/bench --all-targets -- -D warnings || status=1
              cargo test --locked --no-fail-fast --workspace --exclude html5ever || status=1
              exit $status
            '
