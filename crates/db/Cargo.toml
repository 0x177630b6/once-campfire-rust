[package]
name = "campfire_db"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rusqlite.workspace = true
jiff.workspace = true
serde_json.workspace = true
serde_yaml = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
bcrypt.workspace = true
rand.workspace = true
uuid.workspace = true
crc32fast = { workspace = true, optional = true }
tracing.workspace = true
base64.workspace = true

[features]
# `campfire_db::fixtures`: the reference's test fixtures, loaded into a database for tests.
test-support = ["dep:serde_yaml", "dep:crc32fast"]

[dev-dependencies]
campfire_db = { path = ".", features = ["test-support"] }
tempfile.workspace = true
sha1.workspace = true
hex.workspace = true

# The self dev-dependency turns on `test-support` for the crate's own tests.
[package.metadata.cargo-shear]
ignored = ["campfire_db"]
