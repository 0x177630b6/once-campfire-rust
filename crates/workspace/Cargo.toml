[package]
name = "campfire_workspace"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Hermes fork: the Duty Manager Workspace (Fizzy cards in Campfire), kept apart from upstream's crates"

[lints]
workspace = true

# Deliberately no dependency on the other campfire_* crates (see docs/hermes-workspace.md): the
# app adapts to this crate through the traits in `lib.rs`, so upstream merges can't break it and its
# tests run without libvips or the parity seed.
[dependencies]
askama.workspace = true
base64.workspace = true
jiff.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio.workspace = true
