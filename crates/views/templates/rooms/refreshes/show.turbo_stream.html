{#- reference/app/views/rooms/refreshes/show.turbo_stream.erb -#}
{%- if !refresh.new_messages.is_empty() -%}
<turbo-stream action="append" target="{{ crate::messages::room_dom_id(*refresh.room_kind, *refresh.room_id, "messages") }}"><template>
  {%- for message in refresh.new_messages %}
  {% include "messages/_message.html" %}
  {%- endfor %}
</template></turbo-stream>
{%- endif %}
{%- for message in refresh.updated_messages %}
  <turbo-stream action="replace" target="{{ message.dom_id("") }}"><template>{% include "messages/_message.html" %}</template></turbo-stream>
{%- endfor %}
