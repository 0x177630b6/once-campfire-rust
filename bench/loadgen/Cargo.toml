[package]
name = "loadgen"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: not a member of the app workspace (bench/ tooling only).
[workspace]

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio-tungstenite = "0.29"
futures-util = "0.3"
hdrhistogram = "7"
serde_json = "1"
regex = "1"

[profile.release]
debug = false
